<!DOCTYPE html>
<html lang="en">
  <head>
    <title>IAT 339 P02 Process</title>
    <meta charset="utf-8">
    <link href="css/main.css" rel="stylesheet">
  </head>

<body>
  
  <nav>
        <a href="index.html">About</a>
        <a href="menu.html">Menu</a>
        <a href="index.html" class="logo-link">
            <img class="nav-logo" src="img/logo.png" alt="WacDonald's logo"/>
        </a>
        <a href="checkout.html">Checkout</a>
        <a href="contact.html">Contact Us</a>
  </nav>

  <main class="page-container">
    <h1>Contact WacDonald's</h1>

    <section>
      <h2>Send us a Message</h2>
      <p>Have a question, feedback, or just want to talk about burgers? Get in touch with us!</p>
    </section>
    
    <section class="contact-section">

        <form action="#" method="post" class="contact-form">
          
          <section>
            <label for="user-name">Name</label>
            <input type="text" id="user-name" name="name" required placeholder="Your full name">
          </section>

          <section>
            <label for="user-email">Email</label>
            <input type="email" id="user-email" name="email" required placeholder="username@email.com">
          </section>

          <section>
            <label for="user-message">Message</label>
            <input type="user-message" id="message" required placeholder="What's on your mind?"></input>
          </section>
          
          <button class="button">Submit</button>
        </form>

    </section>

  </main>

    <footer class="page-container">

      <img src="img/logo.png" alt="WacDonald's logo" class="footer-logo"/>
      <p>© 2026 WacDonald's All Rights Reserved</p>

      <a href="style-guide.html">
        <p class="link">Style Guide</p>
      </a>

    </footer>

</body>

</html>
