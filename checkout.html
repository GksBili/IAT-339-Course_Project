<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Checkout Page</title>
    <meta charset="utf-8">
    <link href="css/main.css" rel="stylesheet">
  </head>
  <body>
    
  <nav>
        <a href="about-us.html">About</a>
        <a href="menu.html">Menu</a>
        <a href="index.html" class="logo-link">
            <img class="nav-logo" src="img/logo.png" alt="WacDonald's logo"/>
        </a>
        <a href="checkout.html">Checkout</a>
        <a href="contact.html">Contact Us</a>
  </nav>
    <main class="page-container">
      <h1>Checkout</h1>



      <section class="checkout-container">
        <section class="item-checkout">
          <img src="img/Wacburger.png" alt="WacDonald Burger" class="checkout-image">
          <label for="burger-quantity">Quantity:</label>
          <input id="burger-quantity" type="number" name="burger-quantity" min="0" value="0">
        </section>
        
        <section class="item-checkout">
          <img src="img/WacFries.png" alt="WacDonald Fries" class="checkout-image">
          <label for="fries-quantity">Quantity:</label>
          <input id="fries-quantity" type="number" name="fries-quantity" min="0" value="0">
        </section>  

        <section class="item-checkout">
          <img src="img/WacSoda.png" alt="WacDonald Soda" class="checkout-image">
          <label for="soda-quantity">Quantity:</label>
          <input id="soda-quantity" type="number" name="soda-quantity" min="0" value="0">
        </section>  
          

      </section>


      <section>
        <h2>Delivery Options</h2>
        <form>
          <input type="radio" id="delivery" name="method" value="delivery">
          <label for="delivery">Delivery</label><br><br>
          <input type="radio" id="pickup" name="method" value="pickup">
          <label for="pickup">Pickup</label>
        </form>
      </section>

      <section>
        <h2>Delivery Information</h2>
        <form>
          <label for="address">Address:</label>
          <input type="text" id="address" name="address" placeholder="123 Main St"><br><br>

          <label for="city">City:</label>
          <input type="text" id="city" name="city" placeholder="Anytown"><br><br>

          <label for="province">State:</label>
          <input type="text" id="province" name="province" placeholder="BC"><br><br>

          <label for="zip">Zip Code:</label>
          <input type="text" id="zip" name="zip" placeholder="12345"><br><br>
      </section>
      

      <section>
            <h2>Payment</h2>

            <h3>Rendered element:</h3>
            <!-- https://www.w3schools.com/html/html_forms.asp -->
            <form>
              <label for="name">Name:</label>
              <input type="text" id="name" name="name" placeholder="John Doe"><br><br>

              <label for="email">Email:</label>
              <input type="email" id="email" name="email" placeholder="john@example.com"><br><br>

              <label for="card">Card Number:</label>
              <input type="text" id="card" name="card" placeholder="1234 5678 9012 3456"><br><br>

              <label>Payment Method:</label><br>
              <input type="radio" id="credit" name="method" value="credit">
              <label for="credit">Credit Card</label>
              <input type="radio" id="debit" name="method" value="debit">
              <label for="debit">Debit Card</label><br><br>

            </form>

            <a href="payment-complete.html">
              <button class="button">Submit Payment</button>
            </a>

      </section>

          
      

    </main>
    
    <footer class="page-container">

      <img src="img/logo.png" alt="WacDonald's logo" class="footer-logo"/>
      <p>© 2026 WacDonald's All Rights Reserved</p>
      
      <a href="style-guide.html">
        <p class="link">Style Guide</p>
      </a>

    </footer>


  </body>
</html>
