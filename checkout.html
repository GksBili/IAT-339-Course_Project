<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Checkout Page</title>
    <meta charset="utf-8">
    <link href="css/main.css" rel="stylesheet">
  </head>
  <body>
    
    <nav>
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="checkout.html">Checkout</a>
          <a href="style-guide.html">Guideline</a>
    </nav>

    <main>
      <h1>Checkout</h1>
      <p>Your order has been placed successfully!</p>

      <div class="checkout-container">

              <div class="cart">
                <h2>Your Cart</h2>

                <div class="cart-item">
                  <img src="img/burger.jpg" alt="Burger" height="150" width="120">

                  <div class="item-info">
                    <h3>WacDonald Burger</h3>
                    <h4>$2.99</h4>

                    <label>
                      Quantity:
                      <input type="number" value="1" min="1">
                    </label>
                  </div>
                </div>

                <div class="cart-item">
                  <img src="img/fries.jpg" alt="Fries" height="100" width="120">

                  <div class="item-info">
                    <h3>Wac Fries</h3>
                    <h4>$1.01</h4>

                    <label>
                      Quantity:
                      <input type="number" value="2" min="1">
                    </label>
                  </div>
                </div>

                <div class="total">
                  <h3>Total: $6.97</h3>
                  <button class="button">Order</button>
                </div>
              </div>

            </div>
    </main>

    <footer>
      <p>© 2026 WacDonald's All Rights Reserved</p>
      <p>Contact Us: +1 234 567 8910</p>
    </footer>

  </body>
</html>
